name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to publish
        required: true
        default: v0.3.0

permissions:
  contents: read

jobs:
  publish:
    name: Publish release artifacts
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fmd5sum
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download GitHub release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir dist
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --dir dist \
            --pattern "fmd5sum-*.whl" \
            --pattern "fmd5sum-*.tar.gz"

      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
